name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev

      - name: Run Ruff check
        run: uv run ruff check .

      - name: Run Ruff format check
        run: uv run ruff format --check .

  unit-tests:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    env:
      APP_ENV: ci
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev

      - name: Run Unit Tests
        run: uv run poe test

      - name: Run Unit Coverage
        run: uv run poe cov

  integration-tests:
    name: PostgreSQL Integration Tests
    runs-on: ubuntu-latest
    env:
      APP_ENV: ci
      DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/app_test # pragma: allowlist secret
      TEST_DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/app_test # pragma: allowlist secret
      REDIS_URL: redis://localhost:6379/0
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app # pragma: allowlist secret
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev

      - name: Run database migrations
        run: uv run alembic upgrade head

      - name: Run Integration Tests
        run: uv run poe test-integration

  docker-build:
    name: Docker Image Build & Verification
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, integration-tests]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute Git short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image with GIT_SHA
        run: |
          docker build \
            --build-arg GIT_SHA=${{ github.sha }} \
            -t docksmith:ci .

      - name: Verify non-root user execution
        run: |
          USER_ID=$(docker run --rm docksmith:ci id -u)
          if [ "$USER_ID" -eq 0 ]; then
            echo "Error: Container runs as root (UID 0)"
            exit 1
          fi
          echo "Verified non-root user: UID $USER_ID"

      - name: Verify health endpoint returns GIT_SHA
        env:
          TEST_DB_URL: postgresql://test:test@localhost/test # pragma: allowlist secret
        run: |
          docker run -d --name test-health -p 8000:8000 \
            -e APP_ENV=ci \
            -e DATABASE_URL="$TEST_DB_URL" \
            docksmith:ci
          sleep 3
          HEALTH=$(curl -s http://localhost:8000/health)
          echo "Health response: $HEALTH"
          docker stop test-health && docker rm test-health
          if ! echo "$HEALTH" | grep -q "${{ github.sha }}"; then
            echo "Error: Health response missing expected GIT_SHA: ${{ github.sha }}"
            exit 1
          fi

      - name: Publish image to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository }}"
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          docker tag docksmith:ci "${IMAGE_NAME}:main"
          docker tag docksmith:ci "${IMAGE_NAME}:${{ github.sha }}"
          docker tag docksmith:ci "${IMAGE_NAME}:sha-${{ github.sha }}"
          docker tag docksmith:ci "${IMAGE_NAME}:sha-${{ steps.vars.outputs.sha_short }}"
          docker push "${IMAGE_NAME}:main"
          docker push "${IMAGE_NAME}:${{ github.sha }}"
          docker push "${IMAGE_NAME}:sha-${{ github.sha }}"
          docker push "${IMAGE_NAME}:sha-${{ steps.vars.outputs.sha_short }}"
