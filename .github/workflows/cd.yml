name: CD

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types:
      - completed
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Commit SHA to deploy or rollback to (leave blank for latest commit on main)"
        required: false
        default: ""
      rollback:
        description: "Set to 'true' if executing a rollback drill"
        required: false
        default: false
        type: boolean

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Production Deployment & Smoke Tests
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Resolve Target Commit SHA
        id: target
        run: |
          if [ -n "${{ github.event.inputs.target_sha }}" ]; then
            DEPLOY_SHA="${{ github.event.inputs.target_sha }}"
            echo "mode=manual_dispatch" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            DEPLOY_SHA="${{ github.event.workflow_run.head_sha }}"
            echo "mode=workflow_run" >> $GITHUB_OUTPUT
          else
            DEPLOY_SHA="${{ github.sha }}"
            echo "mode=default" >> $GITHUB_OUTPUT
          fi
          echo "sha=$DEPLOY_SHA" >> $GITHUB_OUTPUT
          echo "short_sha=${DEPLOY_SHA:0:7}" >> $GITHUB_OUTPUT
          echo "Target commit SHA to deploy: $DEPLOY_SHA (short: ${DEPLOY_SHA:0:7})"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}

      - name: Validate Required Secrets and Variables
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }} # pragma: allowlist secret
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }} # pragma: allowlist secret
          LIVE_URL: ${{ vars.LIVE_URL }}
        run: |
          MISSING=0
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Missing required configuration: DATABASE_URL"
            MISSING=1
          fi
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::error::Missing required configuration: RENDER_DEPLOY_HOOK"
            MISSING=1
          fi
          if [ -z "$LIVE_URL" ]; then
            echo "::error::Missing required variable: LIVE_URL"
            MISSING=1
          fi
          if [ "$MISSING" -eq 1 ]; then
            echo "FATAL: Deployment aborted due to missing configuration." >&2
            exit 1
          fi
          echo "All required deployment secrets and variables are verified."

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.32"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev

      - name: Run Production Database Migrations
        env:
          APP_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }} # pragma: allowlist secret
          IS_ROLLBACK: ${{ github.event.inputs.rollback }}
        run: |
          if [ "$IS_ROLLBACK" = "true" ]; then
            echo "Rollback mode: verifying current migration state..."
            uv run alembic current || true
          else
            echo "Applying database migrations to production database..."
            uv run alembic upgrade head
          fi

      - name: Trigger Render Deployment with Exact SHA Image
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }} # pragma: allowlist secret
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_URL="ghcr.io/${REPO_LOWER}:${TARGET_SHA}"
          ENCODED_IMAGE_URL=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$IMAGE_URL")

          if [[ "$RENDER_DEPLOY_HOOK" == *"?"* ]]; then
            DEPLOY_URL="${RENDER_DEPLOY_HOOK}&imgURL=${ENCODED_IMAGE_URL}"
          else
            DEPLOY_URL="${RENDER_DEPLOY_HOOK}?imgURL=${ENCODED_IMAGE_URL}"
          fi

          echo "Deploying exact image: $IMAGE_URL"
          echo "Triggering Render deploy hook with imgURL parameter..."
          HTTP_STATUS=$(curl -s -o /tmp/deploy_response.txt -w "%{http_code}" -X POST "$DEPLOY_URL")
          cat /tmp/deploy_response.txt
          echo ""
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Render deploy hook triggered successfully (HTTP $HTTP_STATUS)."
          else
            echo "::error::Deploy hook failed with HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "Waiting 15s for Render service transition..."
          sleep 15

      - name: Run Smoke Tests against Live Deployment
        env:
          LIVE_URL: ${{ vars.LIVE_URL }}
          EXPECTED_SHA: ${{ steps.target.outputs.sha }}
          MAX_RETRIES: "24"
          RETRY_INTERVAL: "5"
        run: |
          echo "Verifying live deployment at $LIVE_URL (Expected SHA: $EXPECTED_SHA)..."
          uv run python scripts/smoke.py "$LIVE_URL" "$EXPECTED_SHA"
