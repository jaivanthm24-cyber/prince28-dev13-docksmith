[project]
name = "docksmith"
version = "0.1.0"
description = "Docker and Compose expert that answers from official docs and checks Dockerfiles with linter and build."
readme = "README.md"
authors = [
    { name = "jaivanthm24-cyber", email = "jaivanth.m.it.28@psvpec.in" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "pydantic-settings>=2.16.3",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
