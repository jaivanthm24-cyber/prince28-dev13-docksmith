[project]
name = "docksmith"
version = "0.1.0"
description = "Docker and Compose expert that answers from official docs and checks Dockerfiles with linter and build."
readme = "README.md"
authors = [
    { name = "jaivanthm24-cyber", email = "jaivanth.m.it.28@psvpec.in" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.115.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "uvicorn[standard]>=0.32.0",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "httpx>=0.28.1",
    "poethepoet>=0.49.0",
    "pre-commit>=4.7.0",
    "pre-commit-hooks>=6.0.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Harmless notice from newer Starlette versions; hide it so real warnings stand out.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.coverage.run]
source = ["docksmith"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.poe.tasks]
dev = "uvicorn docksmith.api.main:create_app --factory --reload --no-access-log"
lint = ["_ruff_check", "_ruff_format"]
_ruff_check = "ruff check ."
_ruff_format = "ruff format --check ."
test = "pytest tests/unit"
cov = "pytest --cov --cov-report=term-missing"
migrate = "alembic upgrade head"
seed = "python scripts/load_db.py"

[tool.poe.tasks.test-integration]
help = "Integration tests against the Postgres from docker compose (run `make up` first)"
cmd = "pytest tests/integration"
# Local compose database only; override by exporting TEST_DATABASE_URL yourself.
env.TEST_DATABASE_URL.default = "postgresql://app:app@localhost:5432/app_test" # pragma: allowlist secret
