[project]
name = "docksmith"
version = "0.1.0"
description = "Docker and Compose expert that answers from official docs and checks Dockerfiles with linter and build."
readme = "README.md"
authors = [
    { name = "jaivanthm24-cyber", email = "jaivanth.m.it.28@psvpec.in" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "pydantic-settings>=2.16.3",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "httpx>=0.28.1",
    "pre-commit>=4.7.0",
    "pre-commit-hooks>=6.0.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Harmless notice from newer Starlette versions; hide it so real warnings stand out.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
